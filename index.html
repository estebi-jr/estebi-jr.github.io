<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<style>
/* Layout: una columna editorial (máx. 1200px). Hero = texto | escenario: vidrio empañado que se vuelve app en un iPhone.
   Proyectos = escenarios que se apilan al hacer scroll. Todo monocromo: el color lo ponen los teasers. */
:root{
  --bg:#FFFFFF; --surface:#F6F6F7; --surface-2:#ECECEF; --line:#E4E4E7; --line-strong:#CBCBD1;
  --fg:#0B0B0C; --fg-2:#3D3D44; --muted:#72727B; --live:#12A150;
  --frame:#0B0B0C; --fog:#DCDFE3; --stage-1:#F3F4F6; --stage-2:#E2E4E8;
  --glass:rgba(255,255,255,.72); --glass-line:rgba(11,11,12,.08); --scrim:rgba(11,11,12,.34);
  --shadow:0 1px 2px rgba(11,11,12,.05),0 22px 48px -26px rgba(11,11,12,.28);
  --scene-1:#3C424A; --scene-2:#23272D; --scene-3:#121418;
  --scene-amber:rgba(255,184,107,.62); --scene-red:rgba(255,92,92,.45); --scene-blue:rgba(170,198,255,.36);
  --poster-base:#0E0E10; --poster-ink:#F5F5F6; --cursor:#FFFFFF; --on-accent:#FFFFFF;
  --code-bg:#121316; --code-fg:#E9E9EC; --code-muted:#6C6E77; --code-str:#A9ACB6; --code-line:rgba(255,255,255,.08);
  --phone-bezel:#0B0B0C; --phone-edge:#3A3A41; --phone-ink:#FFFFFF; --island:#000000;
  --phone-chip:rgba(255,255,255,.2); --phone-shade:rgba(0,0,0,.3); --tap:rgba(255,255,255,.5);
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-xl:30px; --r-lg:22px; --r-md:16px; --r-sm:10px;
  --nav-h:64px; --gutter:clamp(16px,4vw,40px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A0B; --surface:#141416; --surface-2:#1D1D20; --line:#26262A; --line-strong:#3A3A40;
  --fg:#F4F4F5; --fg-2:#C9C9CF; --muted:#8E8E97; --live:#3DD68C;
  --frame:#1F1F22; --fog:#80858C; --stage-1:#1B1C1F; --stage-2:#0E0F11;
  --glass:rgba(20,20,22,.64); --glass-line:rgba(255,255,255,.09); --scrim:rgba(0,0,0,.58);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 56px -28px rgba(0,0,0,.8);
  --phone-shade:rgba(0,0,0,.6); --code-bg:#1A1B1F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A0A0B; --surface:#141416; --surface-2:#1D1D20; --line:#26262A; --line-strong:#3A3A40;
  --fg:#F4F4F5; --fg-2:#C9C9CF; --muted:#8E8E97; --live:#3DD68C;
  --frame:#1F1F22; --fog:#80858C; --stage-1:#1B1C1F; --stage-2:#0E0F11;
  --glass:rgba(20,20,22,.64); --glass-line:rgba(255,255,255,.09); --scrim:rgba(0,0,0,.58);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 56px -28px rgba(0,0,0,.8);
  --phone-shade:rgba(0,0,0,.6); --code-bg:#1A1B1F;
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.sheet-open{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
ul,ol,dl,dd,figure{margin:0;padding:0;list-style:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
section[id]{scroll-margin-top:calc(var(--nav-h) + env(safe-area-inset-top,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--font-display);font-optical-sizing:auto;font-stretch:84%;font-weight:620;letter-spacing:-.035em;line-height:.98;text-wrap:balance}

/* ---------- Botones y piezas ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap;transition:transform .25s var(--ease),background .2s,border-color .2s}
.btn-primary{background:var(--fg);color:var(--bg)}
.btn-ghost{border:1px solid var(--line-strong)}
.btn-ghost:hover{border-color:var(--fg)}
.btn-disabled{border:1px dashed var(--line-strong);color:var(--muted);cursor:default}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line-strong);border-radius:999px;color:var(--fg);transition:border-color .2s,transform .25s var(--ease)}
.icon-btn svg{width:20px;height:20px}
a.icon-btn:hover{border-color:var(--fg)}
a.icon-btn:active{transform:scale(.95)}
.icon-btn[aria-disabled="true"]{opacity:.38;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid var(--line-strong);border-radius:999px;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-2);white-space:nowrap}
.pill i,.status i{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 2.4s ease-out infinite}
.pill-live{border-color:color-mix(in srgb,var(--live) 45%,var(--line))}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg-2);background:var(--bg)}

/* ---------- Cursor propio ---------- */
.cursor{position:fixed;inset:0;pointer-events:none;z-index:100;mix-blend-mode:difference;display:none}
.has-cursor .cursor{display:block}
.has-cursor,.has-cursor *{cursor:none!important}
.cursor-dot,.cursor-ring{position:absolute;left:0;top:0;will-change:transform}
.cursor-dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--cursor)}
.cursor-ring{--s:34px;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);border:1.5px solid var(--cursor);border-radius:50%;display:grid;place-items:center;transition:width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease),background .3s,border-color .3s}
.cursor-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#000;opacity:0;transition:opacity .2s}
.cursor.is-link .cursor-ring{--s:50px}
.cursor.is-label .cursor-ring{--s:82px;background:var(--cursor)}
.cursor.is-label .cursor-label{opacity:1}
.cursor.is-brush .cursor-ring{--s:var(--brush,24px);border-style:dashed}
.cursor.is-brush .cursor-dot{opacity:0}
.cursor.is-hidden{opacity:0}

/* ---------- Navegación ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.is-scrolled{border-bottom-color:var(--line)}
.nav-inner{height:var(--nav-h);display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:14px;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:30px;height:30px;color:var(--fg);transition:transform .5s var(--ease)}
.brand:hover svg{transform:rotate(-8deg) scale(1.06)}
.nav-links{display:none;gap:4px;margin-left:auto}
.nav-links a{padding:8px 14px;border-radius:999px;font-size:14px;color:var(--fg-2);transition:background .2s,color .2s}
.nav-links a:hover{background:var(--surface-2);color:var(--fg)}
.nav-links a.is-active{color:var(--fg);background:var(--surface-2)}
.nav-tools{margin-left:auto;display:flex;gap:8px}
.nav-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--font-mono);font-size:12px;color:var(--fg-2);transition:border-color .2s,color .2s}
.nav-btn:hover{border-color:var(--line-strong);color:var(--fg)}
.nav-btn svg{width:16px;height:16px;flex:none}
.theme-btn .t-label{display:none}
.lang-btn span{min-width:2ch;letter-spacing:.04em}
@media (min-width:900px){.nav-links{display:flex}.nav-tools{margin-left:8px}.theme-btn .t-label{display:inline}}

/* Barra inferior estilo iOS (solo móvil) */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);z-index:45;display:flex;gap:2px;padding:5px;max-width:calc(100% - 32px);border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:var(--shadow)}
.tabbar a{display:grid;justify-items:center;gap:1px;min-width:68px;padding:7px 10px 6px;border-radius:999px;font-size:10.5px;font-weight:500;color:var(--muted);transition:background .25s,color .25s}
.tabbar svg{width:20px;height:20px}
.tabbar svg.ast{stroke-width:11}
.tabbar a.is-active{background:var(--surface-2);color:var(--fg)}
@media (min-width:900px){.tabbar{display:none}}

/* ---------- Hero ---------- */
.hero{padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + clamp(36px,7vw,88px));padding-bottom:clamp(56px,8vw,104px)}
.hero-grid{display:grid;gap:40px;align-items:center}
@media (min-width:900px){.hero-grid{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:64px}}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero h1{font-size:clamp(2.7rem,6vw,5.2rem)}
.hero h1 .soft{color:var(--muted);font-weight:400}
.lede{font-size:clamp(1.05rem,1.4vw,1.2rem);color:var(--fg-2);max-width:46ch}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:6px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-2)}
.hero-count{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}

/* Escenario: vidrio empañado → app en el iPhone → se abre y vuelve al inicio */
.window-wrap{min-width:0;will-change:transform}
.window{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:var(--r-xl);background:var(--frame);padding:10px;box-shadow:var(--shadow)}
.stage{--u:5px;position:relative;width:100%;height:100%;border-radius:calc(var(--r-xl) - 8px);overflow:hidden;isolation:isolate;touch-action:pan-y;background:radial-gradient(120% 90% at 50% 0%,var(--stage-1),var(--stage-2))}
.world{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
.phone{position:absolute;left:calc(var(--u)*19);top:calc(var(--u)*7);width:calc(var(--u)*62);height:calc(var(--u)*128);padding:calc(var(--u)*1.9);border-radius:calc(var(--u)*10.4);background:var(--phone-bezel);box-shadow:0 0 0 calc(var(--u)*.4) var(--phone-edge),0 calc(var(--u)*3) calc(var(--u)*9) var(--phone-shade)}
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--u)*8.6);overflow:hidden;color:var(--phone-ink);background:
  radial-gradient(calc(var(--u)*18) calc(var(--u)*18) at 18% 64%,var(--scene-amber),transparent 70%),
  radial-gradient(calc(var(--u)*14) calc(var(--u)*14) at 78% 76%,var(--scene-red),transparent 70%),
  radial-gradient(calc(var(--u)*24) calc(var(--u)*24) at 84% 20%,var(--scene-blue),transparent 70%),
  radial-gradient(calc(var(--u)*14) calc(var(--u)*14) at 46% 88%,var(--scene-amber),transparent 70%),
  linear-gradient(180deg,var(--scene-1) 0%,var(--scene-2) 46%,var(--scene-3) 100%)}
.sb{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*7.2);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*5.4) 0 calc(var(--u)*6);font:600 calc(var(--u)*2.5)/1 var(--font-body);font-variant-numeric:tabular-nums}
.island{position:absolute;left:50%;top:calc(var(--u)*1.6);width:calc(var(--u)*16.5);height:calc(var(--u)*4.6);margin-left:calc(var(--u)*-8.25);border-radius:999px;background:var(--island)}
.sb svg{width:calc(var(--u)*11);height:calc(var(--u)*2.6)}
.home{position:absolute;left:calc(var(--u)*4.6);right:calc(var(--u)*4.6);top:calc(var(--u)*11);display:grid;grid-template-columns:repeat(4,calc(var(--u)*9));justify-content:space-between;row-gap:calc(var(--u)*3.2)}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.9);width:calc(var(--u)*9)}
.app-icon{position:relative;width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:22.5%;display:grid;place-items:center;background:radial-gradient(circle at 28% 22%,var(--tint) 0%,transparent 74%),var(--poster-base);box-shadow:inset 0 0 0 calc(var(--u)*.12) var(--phone-chip);font:700 calc(var(--u)*4.3)/1 var(--font-display);font-stretch:78%;letter-spacing:-.03em}
.app-slot .app-icon{background:transparent;box-shadow:none}
.app-icon.has-img{background:none;box-shadow:none;overflow:hidden}
.app-icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
/* App del cementerio: como una app descargada en iOS (ícono apagado y nube junto al nombre) */
.app-off .app-icon{filter:grayscale(1);opacity:.5}
.app-off .app-label{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.35);opacity:.8}
.app-off .app-label svg{width:calc(var(--u)*1.75);height:calc(var(--u)*1.75);flex:none}
.app-off .app-label span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.app-label{width:calc(var(--u)*13);text-align:center;font:500 calc(var(--u)*1.55)/1.2 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 calc(var(--u)*.6) var(--phone-shade)}
.search{position:absolute;left:50%;top:calc(var(--u)*72);transform:translateX(-50%);display:flex;align-items:center;gap:calc(var(--u)*.9);height:calc(var(--u)*4.3);padding:0 calc(var(--u)*2.6);border-radius:999px;background:var(--phone-chip);font:500 calc(var(--u)*1.7)/1 var(--font-body)}
.search svg{width:calc(var(--u)*1.9);height:calc(var(--u)*1.9)}
.tap{position:absolute;left:0;top:0;width:calc(var(--u)*7.5);height:calc(var(--u)*7.5);margin:calc(var(--u)*-3.75) 0 0 calc(var(--u)*-3.75);border-radius:50%;background:var(--tap);opacity:0;pointer-events:none}
.glass{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;overflow:hidden;isolation:isolate;will-change:transform;border-radius:calc(var(--r-xl) - 8px)}
.scene{position:absolute;inset:-8%;background:
  radial-gradient(60px 60px at 18% 72%,var(--scene-amber),transparent 70%),
  radial-gradient(90px 90px at 30% 86%,var(--scene-amber),transparent 70%),
  radial-gradient(70px 70px at 72% 80%,var(--scene-red),transparent 70%),
  radial-gradient(46px 46px at 82% 76%,var(--scene-red),transparent 70%),
  radial-gradient(120px 120px at 86% 26%,var(--scene-blue),transparent 70%),
  radial-gradient(80px 80px at 56% 62%,var(--scene-amber),transparent 70%),
  linear-gradient(180deg,var(--scene-1) 0%,var(--scene-2) 52%,var(--scene-3) 100%);
  filter:blur(6px);animation:sceneDrift 22s ease-in-out infinite alternate}
@keyframes sceneDrift{to{transform:translate3d(-3%,1.5%,0) scale(1.04)}}
.glass canvas{position:absolute;inset:0;width:100%;height:100%}
#fog{opacity:.9}
#drops{pointer-events:none}
.glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 64%,rgba(255,255,255,.07) 100%)}
.window-hint{position:absolute;left:14px;bottom:14px;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:rgba(10,10,12,.42);color:#F5F5F6;font-family:var(--font-mono);font-size:11.5px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .4s,transform .4s var(--ease);pointer-events:none}
.window-hint.is-gone{opacity:0;transform:translateY(6px)}
.window-hint svg{width:14px;height:14px}

/* ---------- Secciones ---------- */
.section{padding-block:clamp(72px,10vw,136px)}
.section + .section{border-top:1px solid var(--line)}
.section-head{display:grid;gap:14px;margin-bottom:clamp(32px,5vw,56px)}
@media (min-width:900px){.section-head{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:end;column-gap:64px}.section-head .eyebrow{grid-column:1/-1}}
.section-head h2{font-size:clamp(2.2rem,4.6vw,3.8rem)}
.section-head p{color:var(--fg-2);max-width:48ch}

/* ---------- Proyectos (escenarios apilables) ---------- */
.stack{display:grid;gap:clamp(18px,3vw,28px)}
.project{--cover:0;position:relative;display:grid;gap:18px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);transform-origin:50% 0;transform:scale(calc(1 - var(--cover) * .045))}
.project::after{content:"";position:absolute;inset:-1px;border-radius:inherit;background:var(--bg);opacity:calc(var(--cover) * .6);pointer-events:none}
@media (min-width:900px){
  .project{grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:32px;padding:16px}
}
@media (min-width:900px) and (min-height:700px){
  .project{position:sticky;top:calc(var(--nav-h) + 28px + var(--i) * 14px);box-shadow:var(--shadow)}
}
.project-media{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:var(--r-lg);overflow:hidden;background:var(--poster-base);transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s var(--ease)}
.media-video,.media-img{width:100%;height:100%;object-fit:cover}
.project-info{display:flex;flex-direction:column;gap:14px;padding:4px 6px 6px;min-width:0}
@media (min-width:900px){.project-info{padding:10px 8px 8px 0}}
.project-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.project h3{font-size:clamp(2.1rem,3.8vw,3.1rem)}
.project-tagline{font-size:1.1rem;color:var(--fg-2);max-width:34ch}
.project-actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px;padding-top:8px}

/* Póster mientras llega el teaser */
.poster{position:absolute;inset:0;display:grid;place-items:center;color:var(--poster-ink);background:var(--poster-base);overflow:hidden;isolation:isolate}
.poster::before,.poster::after{content:"";position:absolute;width:75%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--tint) 0%,transparent 66%);opacity:.85;z-index:-1;animation:blob 16s ease-in-out infinite alternate}
.poster::before{left:-18%;top:-38%}
.poster::after{right:-22%;bottom:-48%;opacity:.55;animation-duration:21s;animation-direction:alternate-reverse}
@keyframes blob{to{transform:translate3d(14%,10%,0) scale(1.12)}}
.poster-name{font-family:var(--font-display);font-stretch:78%;font-weight:700;letter-spacing:-.045em;line-height:1;font-size:clamp(2.4rem,8vw,6rem);text-align:center;padding:0 6%}
.poster-label{position:absolute;left:16px;bottom:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.poster-mark{position:absolute;right:14px;top:12px;width:30px;height:30px;color:var(--poster-ink);opacity:.75}

/* ---------- Cementerio ---------- */
.graves{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.grave{display:grid;gap:22px;padding:clamp(24px,4vw,40px);border:1px dashed var(--line-strong);border-radius:clamp(120px,22vw,220px) clamp(120px,22vw,220px) var(--r-md) var(--r-md);text-align:center;justify-items:center}
@media (min-width:900px){.grave{grid-template-columns:auto minmax(0,1fr);text-align:left;justify-items:stretch;align-items:center;column-gap:48px;border-radius:220px var(--r-xl) var(--r-xl) 220px;padding-left:72px}}
.grave-id{display:grid;gap:8px;justify-items:center}
@media (min-width:900px){.grave-id{justify-items:start}}
.grave-mark{width:48px;height:48px;color:var(--fg);stroke-width:17}
.grave h3{font-size:clamp(1.9rem,3.4vw,2.6rem);color:var(--fg-2)}
.grave-dates{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.grave-facts{display:grid;gap:16px;text-align:left;width:100%}
@media (min-width:640px){.grave-facts{grid-template-columns:1fr 1fr;gap:24px}}
.grave-facts dt,.facts dt{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.grave-facts dd{color:var(--fg-2)}
.grave-tagline{color:var(--fg-2);max-width:30ch;text-wrap:balance}
.grave-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
/* El teaser de un proyecto enterrado va en gris, como la foto de una lápida; vuelve al color al pasar el cursor */
.grave-media{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;background:var(--poster-base);box-shadow:0 0 0 1px var(--line)}
.grave-media > *{filter:grayscale(1);opacity:.82;transition:filter .8s var(--ease),opacity .8s var(--ease)}
.grave-media:hover > *,.grave-media:focus-visible > *{filter:none;opacity:1}
.grave.has-media{grid-template-areas:"id" "media" "facts" "actions"}
.grave.has-media .grave-id{grid-area:id}
.grave.has-media .grave-media{grid-area:media}
.grave.has-media .grave-facts{grid-area:facts}
.grave.has-media > .grave-actions{grid-area:actions}
.grave-id .grave-actions{display:none}
@media (min-width:900px){
  .grave.has-media{grid-template-columns:minmax(220px,.7fr) minmax(0,1fr);grid-template-areas:"id media" "id facts";align-items:start;row-gap:30px}
  .grave.has-media .grave-id{align-self:center}
  .grave-id .grave-actions{display:flex;justify-content:flex-start;margin-top:14px}
  .grave > .grave-actions{display:none}
}
.pill svg{width:11px;height:11px;stroke-width:15;flex:none}

/* ---------- Cómo trabajo: pasos a la izquierda, escenario animado a la derecha ----------
   El escenario cuenta cómo nació un proyecto real (PROCESS_DEMO): problema → prototipo → diseño → lanzamiento.
   Todo se mide en cqw (ancho del escenario) para que escale igual en celular y escritorio. */
.proc{display:grid;gap:clamp(28px,4vw,40px);align-items:center}
@media (min-width:900px){.proc{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:64px}.proc-steps{grid-column:1;grid-row:1}.ps{grid-column:2;grid-row:1}}
.proc-steps{display:grid;min-width:0}
.proc-step{position:relative;display:grid;gap:6px;padding:18px 0 22px}
.proc-bar{position:absolute;left:0;right:0;top:0;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.proc-bar i{display:block;width:100%;height:100%;background:var(--fg);transform:scaleX(0);transform-origin:0 50%}
.proc-step.is-done .proc-bar i,.proc-steps:not(.is-auto) .proc-step.is-active .proc-bar i{transform:scaleX(1)}
.proc-steps.is-auto .proc-step.is-active .proc-bar i{animation:procFill var(--d,5s) linear forwards}
.proc-steps.is-held .proc-bar i{animation-play-state:paused}
@keyframes procFill{to{transform:scaleX(1)}}
.step-n{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.proc-step h3{font-family:var(--font-display);font-stretch:88%;font-weight:600;font-size:clamp(1.3rem,2vw,1.6rem);letter-spacing:-.02em;line-height:1.1;color:var(--muted);transition:color .35s}
.proc-step h3 button{text-align:left;letter-spacing:inherit}
.proc-step h3 button::after{content:"";position:absolute;inset:0}
.proc-step p{color:var(--muted);font-size:15px;max-width:46ch;transition:color .35s}
.proc-step.is-active h3,.proc-step:hover h3{color:var(--fg)}
.proc-step.is-active p{color:var(--fg-2)}

.ps{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;min-width:0;border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;isolation:isolate;container-type:inline-size;
  background:radial-gradient(circle,var(--line-strong) 1px,transparent 1.6px) 0 0/22px 22px,var(--surface)}
@media (min-width:900px){.ps{max-width:640px;justify-self:end}}
.ps-art{position:absolute;inset:0;--demo:var(--fg)}
.ps-art.no-anim,.ps-art.no-anim *{transition:none!important;animation:none!important}
.ps-label{position:absolute;left:4.5cqw;right:16cqw;top:4.6cqw;font-family:var(--font-mono);font-size:max(10.5px,2.05cqw);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-toggle{position:absolute;right:12px;top:12px;z-index:6;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--line);color:var(--fg-2);transition:color .2s,border-color .2s}
.ps-toggle:hover{color:var(--fg);border-color:var(--line-strong)}
.ps-toggle svg{width:14px;height:14px}

/* Teléfono */
.ps-phone{position:absolute;left:30cqw;top:12cqw;width:40cqw;height:82cqw;padding:1.3cqw;border-radius:6.6cqw;background:var(--phone-bezel);box-shadow:0 0 0 .25cqw var(--phone-edge),0 3cqw 8cqw -2cqw var(--phone-shade)}
.ps-screen{position:relative;width:100%;height:100%;border-radius:5.4cqw;overflow:hidden;background:var(--bg)}
.ps-island{position:absolute;left:50%;top:1.3cqw;z-index:5;width:11cqw;height:3.2cqw;margin-left:-5.5cqw;border-radius:9cqw;background:var(--island)}

/* Paso 1: el problema, en un chat */
.ps-chat{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.3cqw;padding:6.6cqw 2.4cqw 0;transition:opacity .45s}
.ps-art:not([data-step="0"]) .ps-chat{opacity:0}
.ps-chat-head{display:grid;justify-items:center;gap:.8cqw;padding-bottom:2.2cqw;margin-bottom:1cqw;border-bottom:1px solid var(--line);font:500 max(7px,1.9cqw)/1 var(--font-body);color:var(--fg)}
.ps-av{display:grid;place-items:center;width:7.4cqw;height:7.4cqw;border-radius:50%;background:var(--surface-2);color:var(--fg-2);font:600 3cqw/1 var(--font-body)}
.ps-bub{max-width:82%;padding:1.3cqw 2.1cqw;border-radius:3cqw;font:400 max(7.5px,2.25cqw)/1.3 var(--font-body);opacity:0;transform:translateY(1.6cqw) scale(.94);transition:opacity .35s,transform .5s var(--ease)}
.ps-bub.in{align-self:flex-start;background:var(--surface-2);color:var(--fg);border-bottom-left-radius:.8cqw;transform-origin:0 100%}
.ps-bub.out{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:.8cqw;transform-origin:100% 100%}
.ps-art[data-step="0"] .ps-bub{opacity:1;transform:none;transition-delay:calc(.3s + var(--k) * .75s)}

/* Tarjetas que flotan alrededor del teléfono */
.ps-card{position:absolute;z-index:3;background:var(--bg);border:1px solid var(--line);border-radius:2.8cqw;box-shadow:var(--shadow);opacity:0;transform:translateY(2cqw) scale(.96);transition:opacity .4s,transform .55s var(--ease)}
.ps-card small{font-family:var(--font-mono);font-size:max(9px,1.75cqw);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ps-note{right:4cqw;top:38cqw;width:24cqw;padding:2.4cqw;display:grid;gap:1cqw;rotate:3deg}
.ps-note p{font-family:var(--font-display);font-stretch:86%;font-weight:600;font-size:max(12px,3.1cqw);line-height:1.1;letter-spacing:-.02em;color:var(--fg);text-wrap:balance}
.ps-art[data-step="0"] .ps-note{opacity:1;transform:none;transition-delay:2.3s}

/* Paso 2: escribo el prototipo en código (la IA sugiere en línea) y la V1 aparece en gris; el teléfono se corre para dar espacio */
.ps-phone{transition:transform .8s var(--ease)}
.ps-art[data-step="1"] .ps-phone{transform:translateX(13cqw)}
.ps-code{position:absolute;left:4cqw;top:31cqw;z-index:3;width:50cqw;border-radius:2.8cqw;overflow:hidden;background:var(--code-bg);color:var(--code-fg);box-shadow:var(--shadow),0 0 0 1px var(--code-line);opacity:0;transform:translateX(-4cqw);transition:opacity .4s,transform .6s var(--ease)}
.ps-art[data-step="1"] .ps-code{opacity:1;transform:none;transition-delay:.15s}
.ps-code-bar{display:flex;align-items:center;gap:.9cqw;padding:1.7cqw 2.4cqw;border-bottom:1px solid var(--code-line)}
.ps-code-bar i{width:1.3cqw;height:1.3cqw;border-radius:50%;background:var(--code-muted)}
.ps-code-bar span{margin-left:1.2cqw;font:500 max(7px,1.65cqw)/1 var(--font-mono);color:var(--code-muted)}
.ps-code ol{padding:1.8cqw 2.4cqw 2.4cqw 1.4cqw;counter-reset:ln;font:400 max(7px,1.9cqw)/1.8 var(--font-mono)}
.ps-code li{white-space:pre;counter-increment:ln;clip-path:inset(0 100% 0 0)}
.ps-code li::before{content:counter(ln);display:inline-block;width:3.4cqw;margin-right:1.4cqw;text-align:right;color:var(--code-muted)}
.ps-art[data-step="1"] .ps-code li{clip-path:inset(0);transition:clip-path .5s steps(12) var(--t)}
.ps-code b{font-weight:500}
.ps-code .k,.ps-code .n{color:var(--demo)}
.ps-code .f{font-weight:600;color:var(--code-fg)}
.ps-code .s{color:var(--code-str)}
.ps-code .cg{opacity:0;color:var(--code-muted)}
.ps-code .cg .f{color:inherit}
.ps-art[data-step="1"] .ps-code .cg{opacity:1;color:var(--code-fg);transition:opacity .3s 2.05s,color .4s 2.75s}
.ps-ai{display:inline-flex;align-items:center;gap:.5cqw;margin-left:1.2cqw;padding:0 1cqw;border-radius:9cqw;background:color-mix(in srgb,var(--demo) 22%,transparent);color:var(--demo);font:600 .8em/1.7 var(--font-body);vertical-align:.06em;opacity:0;transform:scale(.6)}
.ps-ai svg{width:1em;height:1em}
.ps-art[data-step="1"] .ps-ai{opacity:1;transform:none;transition:opacity .25s 1.95s,transform .45s var(--ease) 1.95s}
.ps-caret{display:inline-block;width:.55em;height:1.1em;vertical-align:-.2em;background:var(--demo);animation:psCaret 1s steps(1) infinite}
@keyframes psCaret{50%{opacity:0}}
.ps-skel i{position:absolute;display:block;background:var(--surface-2);border-radius:1.2cqw;opacity:0;transform:scale(.9);transition:opacity .3s,transform .45s var(--ease)}
.ps-art:not([data-step="0"]) .ps-skel i{opacity:1;transform:none}
.ps-art[data-step="1"] .ps-skel i{transition-delay:calc(1.2s + var(--k) * .24s)}
.sk-cover{left:0;right:0;top:0;height:22%;border-radius:0 0 3.4cqw 3.4cqw!important}
.sk-av{left:5%;top:17.5%;width:22%;aspect-ratio:1;border-radius:50%!important;box-shadow:0 0 0 .9cqw var(--bg)}
.sk-title{left:5%;top:31.5%;width:68%;height:4%}
.sk-chip{left:5%;top:38%;width:30%;height:3%}
.sk-line{left:5%;top:43%;width:55%;height:3%}
.sk-card{width:43%;height:24%}
.sk-card.a{left:5%;top:50%}.sk-card.b{left:52%;top:50%}.sk-card.c{left:5%;top:76%}.sk-card.d{left:52%;top:76%}

/* Paso 3: el diseño real barre la V1 y aparece el color */
.ps-real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;clip-path:inset(0 100% 0 0);transition:opacity .4s,clip-path 0s .45s}
.ps-art[data-step="2"] .ps-real,.ps-art[data-step="3"] .ps-real{opacity:1;clip-path:inset(0);transition:opacity 0s,clip-path 1.5s var(--ease) .35s}
.ps-wipe{position:absolute;top:0;bottom:0;left:0;z-index:2;width:.5cqw;margin-left:-.25cqw;background:var(--demo);box-shadow:0 0 3cqw var(--demo);opacity:0}
.ps-art[data-step="2"] .ps-wipe{animation:psWipe 1.5s var(--ease) .35s both}
@keyframes psWipe{0%{left:0;opacity:1}88%{opacity:1}100%{left:100%;opacity:0}}
.ps-sel{position:absolute;left:3.2%;top:31.4%;width:70.5%;height:5%;z-index:3;border:max(1px,.3cqw) solid var(--demo);opacity:0;transform:scale(1.05);transition:opacity .3s,transform .45s var(--ease)}
.ps-sel i{position:absolute;width:1.5cqw;height:1.5cqw;background:var(--on-accent);border:max(1px,.3cqw) solid var(--demo)}
.ps-sel i:nth-child(1){left:-.75cqw;top:-.75cqw}.ps-sel i:nth-child(2){right:-.75cqw;top:-.75cqw}.ps-sel i:nth-child(3){left:-.75cqw;bottom:-.75cqw}.ps-sel i:nth-child(4){right:-.75cqw;bottom:-.75cqw}
.ps-sel span{position:absolute;left:-.3cqw;top:calc(100% + 1.2cqw);padding:.6cqw 1.2cqw;border-radius:.8cqw;background:var(--demo);color:var(--on-accent);font:500 max(7px,1.6cqw)/1 var(--font-mono);white-space:nowrap}
.ps-art[data-step="2"] .ps-sel{opacity:1;transform:none;transition-delay:2.1s}
.ps-ver{left:5cqw;top:30cqw;min-width:17cqw;padding:2cqw 2.6cqw;display:grid;gap:.8cqw}
.ps-ver b{font-family:var(--font-display);font-stretch:84%;font-weight:620;font-size:max(18px,6.4cqw);line-height:1;letter-spacing:-.035em;color:var(--fg);font-variant-numeric:tabular-nums}
.ps-swatch{left:5cqw;top:50cqw;display:flex;padding:1.6cqw}
.ps-swatch i{width:5.2cqw;height:5.2cqw;border-radius:50%;background:var(--c);box-shadow:0 0 0 .5cqw var(--bg)}
.ps-swatch i + i{margin-left:-1.4cqw}
.ps-art[data-step="2"] .ps-ver{opacity:1;transform:none;transition-delay:.25s}
.ps-art[data-step="2"] .ps-swatch{opacity:1;transform:none;transition-delay:1.3s}

/* Paso 4: publicado; llega la primera reserva */
.ps-ic{display:block;flex:none;border-radius:22.5%;object-fit:cover}
.ps-notif{position:absolute;left:1.6cqw;right:1.6cqw;top:5.4cqw;z-index:4;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:1.6cqw;padding:1.6cqw;border-radius:3.4cqw;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);box-shadow:0 2cqw 5cqw -2cqw var(--phone-shade);transform:translateY(-170%);transition:transform .5s var(--ease)}
.ps-notif .ps-ic{width:6cqw;height:6cqw}
.ps-notif p{font-size:max(7.5px,1.85cqw);line-height:1.25;color:var(--fg)}
.ps-notif p:first-child{display:flex;justify-content:space-between;gap:1cqw;margin-bottom:.3cqw;font-size:max(6.5px,1.5cqw);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ps-notif b{font-weight:600}
.ps-art[data-step="3"] .ps-notif{transform:none;transition:transform .7s cubic-bezier(.2,1.25,.3,1) 1s}
.ps-live{left:3.5cqw;bottom:9cqw;width:44cqw;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:1.2cqw 2cqw;padding:2.2cqw}
.ps-live .ps-ic{width:8.6cqw;height:8.6cqw;grid-row:span 2}
.ps-live b{display:block;font-weight:600;font-size:max(12px,2.7cqw);line-height:1.2;color:var(--fg)}
.ps-live div span{display:block;font-family:var(--font-mono);font-size:max(9px,1.7cqw);line-height:1.3;color:var(--muted)}
.ps-live .pill{grid-column:2;justify-self:start;height:auto;padding:.5cqw 1.4cqw;font-size:max(9.5px,1.8cqw)}
.ps-art[data-step="3"] .ps-live{opacity:1;transform:none;transition-delay:.35s}

.tools{margin-top:clamp(56px,8vw,96px);display:grid;gap:18px}
@media (min-width:900px){.tools{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);column-gap:64px}}
.tools-head{display:grid;gap:10px;align-content:start}
.tools-head p:last-child{color:var(--fg-2);max-width:40ch}
.tool-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));column-gap:24px;border-top:1px solid var(--line)}
.tool-list li{padding:15px 0;border-bottom:1px solid var(--line);font-family:var(--font-display);font-stretch:88%;font-weight:560;font-size:clamp(1.1rem,1.5vw,1.3rem);letter-spacing:-.015em;line-height:1.2;color:var(--fg)}

/* ---------- Sobre mí (breve, a propósito) ---------- */
.about{display:grid;gap:36px;align-items:center}
@media (min-width:800px){.about{grid-template-columns:240px minmax(0,1fr);gap:56px}}
.portraits{position:relative;width:min(200px,60vw);aspect-ratio:4/5;margin-inline:auto}
@media (min-width:800px){.portraits{margin-inline:0}}
.portrait{position:absolute;inset:0;display:grid;align-content:end;justify-items:start;gap:4px;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);overflow:hidden;transition:transform .6s var(--ease),z-index 0s .2s;box-shadow:var(--shadow)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portrait svg{position:absolute;right:-18%;top:-6%;width:90%;height:90%;color:var(--line-strong);opacity:.7}
.portrait span{position:relative;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.portrait b{position:relative;font-weight:500;font-size:14px}
.portrait[data-pos="0"]{z-index:3;transform:rotate(-2deg)}
.portrait[data-pos="1"]{z-index:2;transform:translate(14%,-4%) rotate(5deg)}
.portrait[data-pos="2"]{z-index:1;transform:translate(-12%,5%) rotate(-8deg)}
.about-text{display:grid;gap:16px;min-width:0}
.about-text h2{font-family:var(--font-display);font-stretch:86%;font-weight:600;font-size:1.9rem;letter-spacing:-.025em}
.about-text p{color:var(--fg-2);max-width:58ch}
#about-bio{display:grid;gap:12px}
.portrait:not([data-pos="0"]) span,.portrait:not([data-pos="0"]) b{opacity:0;transition:opacity .3s}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:4px}
.email{display:inline-flex;align-items:center;height:44px;font-family:var(--font-mono);font-size:14px;padding:0 16px;border:1px solid var(--line);border-radius:999px;user-select:all;overflow-wrap:anywhere;cursor:copy;transition:border-color .2s}
.email:hover{border-color:var(--line-strong)}

/* ---------- Footer / banner de tags ---------- */
.footer{border-top:1px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
@media (min-width:900px){.footer{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}}
.marquee{--tag-h:clamp(58px,8.4vw,108px);overflow:hidden;padding-block:clamp(28px,5vw,52px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee-track{display:flex;width:max-content;animation:marquee var(--dur,90s) linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-set{display:flex;align-items:center;gap:clamp(36px,5vw,72px);padding-right:clamp(36px,5vw,72px)}
.marquee-word{font-family:var(--font-display);font-stretch:80%;font-weight:700;letter-spacing:-.04em;font-size:calc(var(--tag-h) * 1.32);line-height:1;color:transparent;-webkit-text-stroke:1.4px var(--fg);white-space:nowrap}
.tag{display:block;height:var(--tag-h);width:auto;flex:none;color:var(--fg)}
@keyframes marquee{to{transform:translateX(-50%)}}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.foot a:hover{color:var(--fg)}

/* ---------- Hoja de detalle (sheet estilo iOS) ---------- */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:100%;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 28px);padding:0;border:1px solid var(--line);border-bottom:0;border-radius:var(--r-xl) var(--r-xl) 0 0;background:var(--bg);color:var(--fg);overflow:hidden;transform:translateY(102%);transition:transform .5s var(--ease)}
dialog.sheet.is-in{transform:none}
dialog.sheet::backdrop{background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
dialog.sheet.is-in::backdrop{opacity:1}
@media (min-width:900px){
  dialog.sheet{inset:0;margin:auto;width:min(980px,calc(100% - 64px));max-height:min(90vh,940px);border-bottom:1px solid var(--line);border-radius:var(--r-xl);transform:translateY(28px) scale(.98);opacity:0;transition:transform .5s var(--ease),opacity .35s}
  dialog.sheet.is-in{transform:none;opacity:1}
}
.sheet-inner{display:flex;flex-direction:column;max-height:inherit}
.sheet-bar{position:relative;display:flex;align-items:center;gap:12px;padding:14px 18px 12px;border-bottom:1px solid var(--line);touch-action:none}
.sheet-grabber{position:absolute;left:50%;top:6px;width:38px;height:5px;margin-left:-19px;border-radius:9px;background:var(--line-strong)}
@media (min-width:900px){.sheet-grabber{display:none}}
.sheet-kicker{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sheet-close{margin-left:auto;font-size:15px;font-weight:500;padding:6px 4px}
.sheet-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px;display:flex;flex-direction:column;gap:28px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.sheet-body > *{flex:none}
dialog.sheet:focus{outline:none}
@media (min-width:900px){.sheet-body{padding:24px 28px 32px}}
.sheet-media{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r-lg);overflow:hidden;background:var(--poster-base)}
.sheet-grid{display:grid;gap:28px}
@media (min-width:800px){.sheet-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:44px}}
.sheet-main{display:grid;gap:12px;align-content:start;min-width:0}
.sheet-main h2{font-size:clamp(2.4rem,5vw,3.6rem)}
.sheet-tagline{font-size:1.15rem;color:var(--fg-2)}
.sheet-main h3{margin-top:14px;font-family:var(--font-mono);font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet-main p{color:var(--fg-2);max-width:60ch}
.sheet-side{display:grid;gap:22px;align-content:start;min-width:0}
.facts{display:grid;gap:16px;padding:18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.facts dd{font-size:15px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.shots img{height:min(420px,62vh);width:auto;max-width:none;border-radius:var(--r-md);border:1px solid var(--line);scroll-snap-align:start}
.sheet-nav{display:flex;justify-content:space-between;gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.sheet-nav button{font-size:14px;color:var(--fg-2);padding:6px 0}
.sheet-nav button:hover{color:var(--fg)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:120;transform:translate(-50%,16px);padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:32px}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .marquee-track{animation:none}
}
</style>
</head>

const html = document.documentElement;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

/* ---------- Idioma ---------- */
function pickLang() {
  let q = null;
  try { q = new URLSearchParams(location.search).get('lang'); } catch {}
  const v = q || store.get('lang') || ((navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en');
  return v === 'en' ? 'en' : 'es';
}
let lang = pickLang();
const tr = v => (v && typeof v === 'object' && !Array.isArray(v)) ? (v[lang] ?? v.es ?? '') : (v ?? '');
const ui = (k, vars) => {
  let s = UI[lang][k] ?? UI.es[k] ?? k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.split(`{${a}}`).join(b);
  return s;
};

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('is-on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('is-on'), 2200);
}

  return `<span class="poster" style="--tint:${esc(p.tint || '#8A8A93')}">

}
const statusHTML = p => p.url ? `<span class="pill pill-live"><i></i>${esc(ui('live'))}</span>` : `<span class="pill">${esc(ui('link_soon'))}</span>`;

/* ---------- Tema (Auto / Claro / Oscuro) ---------- */
const THEME_NEXT = { auto: 'light', light: 'dark', dark: 'auto' };
let theme = store.get('theme') || 'auto';
function applyTheme(t, quiet = false) {
  if (t === 'auto') html.removeAttribute('data-theme'); else html.setAttribute('data-theme', t);
  const name = ui('theme_' + t);
  $('#theme-label').textContent = name;
  $('#theme-btn').setAttribute('aria-label', ui('theme_aria', { t: name }));
  if (!quiet) toast(ui('theme_toast', { t: name.toLowerCase() }));
}
$('#theme-btn').addEventListener('click', () => {
  theme = THEME_NEXT[theme]; store.set('theme', theme); applyTheme(theme); Hero.refresh();
});
$('#lang-btn').addEventListener('click', () => {
  lang = lang === 'es' ? 'en' : 'es'; store.set('lang', lang); renderAll(); toast(ui('lang_toast'));
});

/* ---------- Hero: la E se dibuja en el vidrio, el vidrio se vuelve app en el iPhone, se abre y vuelve a empezar ---------- */
const Hero = (() => {
  const stage = $('#stage'), world = $('#world'), glass = $('#glass'), cv = $('#fog'), dv = $('#drops');
  const hint = $('#window-hint'), home = $('#home'), tapEl = $('#tap');
  const ctx = cv.getContext('2d'), dctx = dv.getContext('2d');
  // Línea de tiempo del loop (ms)
  const L = 9200, T = { d0: 350, d1: 3000, o0: 3800, o1: 5400, p0: 6150, p1: 6350, p2: 6650, i0: 6750, i1: 8350, f1: 8150 };
  let V = 0, dpr = 1, ls = 1, lx = 0, ly = 0, slot = { x: 0, y: 0, w: 1 }, Z = 1, F = { x: 0, y: 0 }, r0 = 22;
  let t = 0, last = 0, raf = 0, visible = false, paused = false, resumeT = 0, done = 0, resetDone = true, touched = false, prev = null, lastAmb = 0, lastUser = -1e9;
  let camKey = '', glassKey = '';

  const segLen = LOGO_STROKES.map(c => {
    let len = 0, px = c[0], py = c[1];
    for (let i = 1; i <= 48; i++) {
      const k = i / 48, u = 1 - k;
      const x = u*u*u*c[0] + 3*u*u*k*c[2] + 3*u*k*k*c[4] + k*k*k*c[6];
      const y = u*u*u*c[1] + 3*u*u*k*c[3] + 3*u*k*k*c[5] + k*k*k*c[7];
      len += Math.hypot(x - px, y - py); px = x; py = y;
    }
    return len;
  });
  const total = segLen.reduce((a, b) => a + b, 0);
  const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const clamp01 = k => Math.min(1, Math.max(0, k));
  const fogColor = () => getComputedStyle(html).getPropertyValue('--fog').trim() || '#DCDFE3';
  const brush = () => 17 * ls * 1.12;

  const CLOUD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5h10.2a4.2 4.2 0 0 0 .5-8.4A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/></svg>';
  function iconHTML(p) {
    if (p.icon) return `<span class="app-icon has-img"><img src="${esc(p.icon)}" alt="" decoding="async"></span>`;
    const g = p.glyph || (p.name.match(/\d/) || [p.name[0]])[0];
    return `<span class="app-icon" style="--tint:${esc(p.tint)}">${esc(g)}</span>`;
  }
  function renderHome() {
    const apps = PROJECTS.map(p => `<div class="app">${iconHTML(p)}<span class="app-label">${esc(p.name)}</span></div>`).join('');
    const dead = GRAVEYARD.filter(g => g.icon).map(g => `<div class="app app-off">${iconHTML(g)}<span class="app-label">${CLOUD}<span>${esc(g.name)}</span></span></div>`).join('');
    home.innerHTML = apps + `<div class="app app-slot"><span class="app-icon" id="slot"></span><span class="app-label">esteban</span></div>` + dead;
  }
  function clock() {
    const d = new Date(), h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
    $('#phone-time').textContent = `${lang === 'en' ? (h % 12 || 12) : h}:${m}`;
  }
  function offsetIn(el, root) {
    let x = 0, y = 0;
    while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
    return { x, y };
  }

  function fill(alpha) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = alpha;
    ctx.fillStyle = fogColor(); ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
  }
  function drops() {
    dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.clearRect(0, 0, dv.width, dv.height);
    const n = Math.round(V * V / 260);
    for (let i = 0; i < n; i++) {
      const x = Math.random() * dv.width, y = Math.random() * dv.height;
      const r = (Math.pow(Math.random(), 2.6) * 3.6 + 0.5) * dpr;
      dctx.beginPath(); dctx.arc(x, y, r, 0, 7); dctx.fillStyle = 'rgba(12,14,18,.16)'; dctx.fill();
      dctx.beginPath(); dctx.arc(x - r * .3, y - r * .35, r * .38, 0, 7); dctx.fillStyle = 'rgba(255,255,255,.55)'; dctx.fill();
    }
  }
  function eraseSeg(c, from, to) {
    ctx.save(); ctx.setTransform(dpr * ls, 0, 0, dpr * ls, dpr * lx, dpr * ly);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 17 * 1.12;
    ctx.setLineDash([Math.max(.01, to - from), 1e5]); ctx.lineDashOffset = -from;
    ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.bezierCurveTo(c[2], c[3], c[4], c[5], c[6], c[7]); ctx.stroke();
    ctx.restore();
  }
  function eraseRange(a0, b0) { // borra el trazo del logo entre las longitudes a0 y b0
    let acc = 0;
    LOGO_STROKES.forEach((c, i) => {
      const a = acc, b = acc + segLen[i];
      const from = Math.max(a0, a), to = Math.min(b0, b);
      if (to > from) eraseSeg(c, from - a, to - a);
      acc = b;
    });
  }
  function eraseTo(target) { if (target > done) { eraseRange(done, target); done = target; } }

  function camera() { // p: 0 = vidrio a pantalla completa, 1 = iPhone completo
    let p = 0;
    if (t >= T.o0 && t < T.o1) p = ease((t - T.o0) / (T.o1 - T.o0));
    else if (t >= T.o1 && t < T.i0) p = 1;
    else if (t >= T.i0 && t < T.i1) p = 1 - ease((t - T.i0) / (T.i1 - T.i0));
    let press = 0;
    if (t >= T.p0 && t < T.p1) press = (t - T.p0) / (T.p1 - T.p0);
    else if (t >= T.p1 && t < T.p2) press = 1;
    else if (t >= T.p2 && t < T.i0) press = 1 - (t - T.p2) / (T.i0 - T.p2);
    return { p, press: clamp01(press) };
  }
  function apply() {
    const { p, press } = camera();
    const s = Math.exp(Math.log(Z) * (1 - p));
    const tx = F.x * (1 - s), ty = F.y * (1 - s);
    const ck = `${tx.toFixed(2)},${ty.toFixed(2)},${s.toFixed(4)}`;
    if (ck !== camKey) { camKey = ck; world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; }
    world.style.visibility = p < .0005 ? 'hidden' : 'visible';
    const m = 1 - .09 * press, k = slot.w / V * m;
    const gx = slot.x + slot.w * (1 - m) / 2, gy = slot.y + slot.w * (1 - m) / 2;
    const rad = r0 + (0.225 * V - r0) * p;
    const gk = `${(tx + s * gx).toFixed(2)},${(ty + s * gy).toFixed(2)},${(s * k).toFixed(5)},${rad.toFixed(1)}`;
    if (gk !== glassKey) {
      glassKey = gk;
      glass.style.transform = `translate(${tx + s * gx}px,${ty + s * gy}px) scale(${s * k})`;
      glass.style.borderRadius = rad + 'px';
    }
    tapEl.style.left = (slot.x + slot.w / 2) + 'px'; tapEl.style.top = (slot.y + slot.w / 2) + 'px';
    tapEl.style.opacity = (press * .85).toFixed(3);
    tapEl.style.transform = `scale(${(.7 + .3 * press).toFixed(3)})`;
    hint.classList.toggle('is-gone', touched || p > 0);
    return p;
  }

  function resize() {
    V = stage.clientWidth; if (!V) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    stage.style.setProperty('--u', V / 100 + 'px');
    glass.style.width = glass.style.height = V + 'px';
    for (const c of [cv, dv]) { c.width = Math.round(V * dpr); c.height = Math.round(V * dpr); }
    ls = V * .84 / 660; lx = V / 2 - 400 * ls; ly = V / 2 - 400 * ls;
    r0 = parseFloat(getComputedStyle(stage).borderTopLeftRadius) || 22;
    const icon = $('#slot'), o = offsetIn(icon, world);
    slot = { x: o.x, y: o.y, w: icon.offsetWidth || V * .09 };
    Z = V / slot.w; F = { x: Z * slot.x / (Z - 1), y: Z * slot.y / (Z - 1) };
    $('#cursor').style.setProperty('--brush', brush() + 'px');
    camKey = glassKey = '';
    fill(1); drops(); done = 0; resetDone = false;
    t = reduceMotion ? T.d1 : 0;
    if (reduceMotion) eraseTo(total);
    apply(); wake();
  }

  function frame(now) {
    raf = 0;
    const dt = Math.min(50, now - (last || now)); last = now;
    if (!paused && !reduceMotion) {
      t += dt;
      if (t >= L) { t -= L; if (!resetDone) fill(1); done = 0; resetDone = false; clock(); }
    }
    if (t >= T.d0 && t < T.o0) eraseTo(ease(clamp01((t - T.d0) / (T.d1 - T.d0))) * total);
    if (t >= T.i0 && t < T.f1 && !paused) fill(1 - Math.pow(1 - .06, dt / 16.7));
    if (t >= T.f1 && !resetDone) { fill(1); done = 0; resetDone = true; }
    if (paused && now - lastAmb > 50) { fill(.011); lastAmb = now; }
    apply();
    const busy = !reduceMotion || now - lastUser < 7000;
    if (visible && !document.hidden && busy) raf = requestAnimationFrame(frame);
  }
  function wake() { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } }

  // Dibujar con el cursor o el dedo (solo cuando el vidrio llena el cuadro)
  const inGlass = () => camera().p === 0;
  function userDraw(x, y) {
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'destination-out'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = brush();
    ctx.beginPath(); ctx.moveTo(prev ? prev.x : x, prev ? prev.y : y); ctx.lineTo(x, y); ctx.stroke(); ctx.restore();
    prev = { x, y }; lastUser = performance.now(); touched = true;
    paused = !reduceMotion;
    clearTimeout(resumeT);
    resumeT = setTimeout(() => { paused = false; prev = null; eraseRange(0, done); wake(); }, 1600);
    wake();
  }
  const pos = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  stage.addEventListener('pointermove', e => {
    if (!inGlass()) return;
    if (e.pointerType === 'mouse' || e.buttons || e.pointerType === 'pen') { const p = pos(e); userDraw(p.x, p.y); }
  });
  stage.addEventListener('pointerdown', e => { if (!inGlass()) return; prev = null; const p = pos(e); userDraw(p.x, p.y); });
  ['pointerleave', 'pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, () => { prev = null; }));

  new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible) wake(); }, { threshold: .05 }).observe(stage);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  let rT; new ResizeObserver(() => { clearTimeout(rT); rT = setTimeout(resize, 120); }).observe(stage);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => refresh());
  function refresh() { // el color de la niebla cambia con el tema
    if (t >= T.i0 && t < T.f1) return;
    fill(1); if (t < T.f1) eraseRange(0, done);
  }
  function relabel() { renderHome(); clock(); resize(); }
  renderHome(); clock();
  return { refresh, relabel };
})();

/* ---------- Cómo trabajo: la historia de un proyecto en 4 pasos. Avanza sola cuando se ve; tocar un paso salta a él ---------- */
const Process = (() => {
  const ps = $('#ps'), art = $('#ps-art'), list = $('#steps'), toggle = $('#ps-toggle');
  const D = PROCESS_DEMO, DUR = D.durations;
  const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>';
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg>';
  let step = 0, playing = !reduceMotion, visible = false, started = reduceMotion;
  let timer = 0, t0 = 0, left = 0, verT = 0;

  function render() {
    const p = PROJECTS.find(x => x.id === D.project) || PROJECTS[0];
    art.style.setProperty('--demo', p.tint);
    $('#ps-av').textContent = tr(D.contact).charAt(0);
    $('#ps-contact').textContent = tr(D.contact);
    $$('.ps-bub', art).forEach((b, i) => { b.textContent = tr(D.chat[i]); });
    $('#ps-problem').textContent = ui('demo_problem');
    $('#ps-note').textContent = tr(D.note);
    $('#ps-iter').textContent = ui('demo_iter');
    $('#ps-swatch').innerHTML = D.swatches.map(c => `<i style="--c:${esc(c)}"></i>`).join('');
    $('#ps-sel').textContent = D.selection;
    const real = $('#ps-real'); if (real.getAttribute('src') !== D.shot) real.src = D.shot;
    $$('.ps-ic', art).forEach(img => { if (p.icon && img.getAttribute('src') !== p.icon) img.src = p.icon; });
    $('#ps-app').textContent = p.name;
    $('#ps-now').textContent = ui('demo_now');
    $('#ps-notif').textContent = tr(D.notif);
    $('#ps-live-name').textContent = p.name;
    // Corta la URL solo después de la "/" (guion sin quiebre y espacio invisible) para que no se parta en "estebi-"
    $('#ps-live-url').textContent = (p.url || '').replace(/^https?:\/\//, '').replace(/\/$/, '').replace(/-/g, '\u2011').replace(/\//g, '/\u200B');
    $('#ps-live').textContent = ui('live');
    list.innerHTML = STEPS.map((s, i) => `
      <li class="proc-step" data-i="${i}" style="--d:${DUR[i] || 5000}ms">
        <span class="proc-bar"><i></i></span>
        <span class="step-n">${esc(ui('step'))} ${i + 1}</span>
        <h3><button type="button" data-go="${i}">${esc(tr(s.title))}</button></h3>
        <p>${esc(tr(s.text))}</p>
      </li>`).join('');
    toggle.hidden = reduceMotion;
    if (started && playing && visible) go(step); else { paint(); scripts(step, false); }
  }

  function paint() {
    $$('.proc-step', list).forEach((li, i) => {
      li.classList.toggle('is-active', i === step);
      li.classList.toggle('is-done', i < step);
      $('button', li).setAttribute('aria-pressed', String(i === step));
    });
    list.classList.toggle('is-auto', playing);
    $('#ps-label').textContent = `${ui('proc_step', { i: step + 1, n: STEPS.length })} · ${tr(STEPS[step].title)}`;
    toggle.innerHTML = playing ? PAUSE : PLAY;
    toggle.setAttribute('aria-label', ui(playing ? 'proc_pause' : 'proc_play'));
  }

  // Contador de iteraciones (paso 3); el código del paso 2 se escribe solo con CSS
  function scripts(i, animate = true) {
    clearInterval(verT);
    const ver = $('#ps-ver');
    if (i === 2 && animate && !reduceMotion) {
      let v = 1; ver.textContent = 'v1';
      verT = setInterval(() => { v += 1; ver.textContent = 'v' + v; if (v >= D.versions) clearInterval(verT); }, 120);
    } else ver.textContent = 'v' + D.versions;
  }

  function arm(ms) {
    clearTimeout(timer); timer = 0; left = ms;
    if (!playing || !visible || document.hidden) return;
    t0 = performance.now();
    timer = setTimeout(() => go((step + 1) % STEPS.length), ms);
  }
  function go(i) {
    step = i;
    art.dataset.step = String(i);
    paint();
    const bar = $(`.proc-step[data-i="${i}"] .proc-bar i`, list);
    if (bar) { bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = ''; }
    scripts(i);
    arm(DUR[i] || 5000);
  }
  function hold() { // fuera de pantalla o pestaña oculta: congela el tiempo que quedaba
    if (timer) { clearTimeout(timer); timer = 0; left = Math.max(0, left - (performance.now() - t0)); }
    list.classList.add('is-held');
  }
  function release() {
    list.classList.remove('is-held');
    if (!started) { // la primera vez que se ve, la historia parte desde el principio
      started = true;
      art.classList.add('no-anim'); art.dataset.step = ''; void art.offsetWidth; art.classList.remove('no-anim');
      go(0); return;
    }
    if (playing && !timer) arm(left || DUR[step]);
  }

  list.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go)); });
  toggle.addEventListener('click', () => {
    playing = !playing;
    if (playing) { started = true; go(step); }
    else { clearTimeout(timer); timer = 0; paint(); }
  });
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible && !document.hidden) release(); else hold(); }, { threshold: .35 }).observe(ps);
  document.addEventListener('visibilitychange', () => { if (document.hidden) hold(); else if (visible) release(); });
  return { render };
})();

/* ---------- Detalle de proyecto ---------- */
const sheet = $('#sheet'), sheetBody = $('#sheet-body');
let currentId = null;
// Un id puede ser un proyecto o una app del cementerio (las dos abren la misma hoja)
function findItem(id) {
  const p = PROJECTS.find(x => x.id === id);
  if (p) return { p, list: PROJECTS, grave: false };
  const g = GRAVEYARD.find(x => x.id === id && hasMedia(x));
  return g ? { p: g, list: GRAVEYARD, grave: true } : null;
}
function sheetHTML({ p, list, grave }) {
  const i = list.indexOf(p), n = list.length;
  const prev = list[(i - 1 + n) % n], next = list[(i + 1) % n];
  const when = grave ? `${p.born} — ${p.died}` : p.year;
  const meta = grave
    ? `<span class="pill"><svg aria-hidden="true"><use href="#asterisk"/></svg>${esc(ui('buried'))}</span><span>${esc(tr(p.kind))}</span><span>${esc(when)}</span>`
    : `${statusHTML(p)}<span>${esc(tr(p.kind))}</span><span>${esc(p.year)}</span>`;
  return `
    <div class="sheet-media">${mediaHTML(p)}</div>
    <div class="sheet-grid">
      <div class="sheet-main">
        <div class="project-meta">${meta}</div>
        <h2 class="display" id="sheet-title">${esc(p.name)}</h2>
        <p class="sheet-tagline">${esc(tr(p.tagline))}</p>
        <h3>${esc(ui('what'))}</h3><p>${esc(tr(p.description))}</p>
        ${tr(p.story) ? `<h3>${esc(ui('story'))}</h3><p>${esc(tr(p.story))}</p>` : ''}
        ${tr(p.built) ? `<h3>${esc(ui('how'))}</h3><p>${esc(tr(p.built))}</p>` : ''}
        ${grave ? `<h3>${esc(ui('cause'))}</h3><p>${esc(tr(p.cause))}</p><h3>${esc(ui('lesson'))}</h3><p>${esc(tr(p.lesson))}</p>` : ''}
      </div>
      <aside class="sheet-side">
        <dl class="facts">
          <div><dt>${esc(ui('stack'))}</dt><dd>${esc(p.stack.join(' · '))}</dd></div>
          <div><dt>${esc(ui(grave ? 'lifespan' : 'year'))}</dt><dd>${esc(when)}</dd></div>
        </dl>
        <div class="sheet-actions">
          ${p.url ? `<a class="btn btn-primary" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(ui('open_name', { n: p.name }))}</a>` : `<span class="btn btn-disabled" aria-disabled="true">${esc(ui('link_soon'))}</span>`}
          ${p.repo ? `<a class="btn btn-ghost" href="${esc(p.repo)}" target="_blank" rel="noopener">${esc(ui('view_code'))}</a>` : ''}
        </div>
      </aside>
    </div>
    ${p.shots && p.shots.length ? `<div class="shots" tabindex="0" aria-label="${esc(ui('shots_of', { n: p.name }))}">${p.shots.map((src, k) => `<img src="${esc(src)}" alt="${esc(ui('shot_alt', { i: k + 1, n: p.name }))}" loading="lazy">`).join('')}</div>` : ''}
    ${n > 1 ? `<nav class="sheet-nav" aria-label="${esc(ui('other_projects'))}">
      <button type="button" data-open="${esc(prev.id)}">← ${esc(prev.name)}</button>
      <button type="button" data-open="${esc(next.id)}">${esc(next.name)} →</button>
    </nav>` : ''}`;
}
function fillSheet(id) {
  const item = findItem(id); if (!item) return null;
  const { p, list, grave } = item;
  currentId = id;
  sheetBody.innerHTML = sheetHTML(item);
  $('#sheet-kicker').textContent = grave ? ui('nav_graveyard') : ui('of', { i: list.indexOf(p) + 1, n: list.length });
  $$('video', sheetBody).forEach(v => { v.play().catch(() => {}); });
  return p;
}
function openProject(id) {
  const p = fillSheet(id); if (!p) return;
  sheetBody.scrollTop = 0;
  if (!sheet.open) {
    sheet.showModal(); sheet.focus({ preventScroll: true }); html.classList.add('sheet-open'); html.classList.remove('has-cursor');
    requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('is-in')));
  }
  try { history.replaceState(null, '', '#' + p.id); } catch {}
}
function closeSheet() {
  if (!sheet.open) return;
  sheet.classList.remove('is-in'); sheet.style.transform = '';
  setTimeout(() => { sheet.close(); html.classList.remove('sheet-open'); if (cursorOn) html.classList.add('has-cursor'); sheetBody.innerHTML = ''; currentId = null; }, 420);
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
}
$('#sheet-close').addEventListener('click', closeSheet);
sheet.addEventListener('cancel', e => { e.preventDefault(); closeSheet(); });
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-open]'); if (!b) return;
  e.preventDefault(); openProject(b.dataset.open);
});
(() => { // deslizar hacia abajo para cerrar (móvil)
  const bar = $('#sheet-bar'); let y0 = null, dy = 0;
  bar.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; bar.setPointerCapture(e.pointerId); sheet.style.transition = 'none'; });
  bar.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 === null) return; y0 = null; sheet.style.transition = ''; if (dy > 110) closeSheet(); else sheet.style.transform = ''; };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
})();

/* ---------- Correo: tocar la dirección la copia; el botón abre el correo ---------- */
async function copyEmail() {
  try { await navigator.clipboard.writeText(PROFILE.email); toast(ui('email_copied')); }
  catch {
    const r = document.createRange(); r.selectNodeContents($('#email-text'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast(ui('email_selected'));
  }
}
$('#email-text').addEventListener('click', copyEmail);
$('#email-text').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyEmail(); } });

/* ---------- Retratos ---------- */
(() => {
  const box = $('#portraits');
  const cycle = () => $$('.portrait', box).forEach(el => { el.dataset.pos = (Number(el.dataset.pos) + 2) % 3; });
  box.addEventListener('click', cycle);
  box.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycle(); } });
})();

/* ---------- Cursor propio ---------- */
const cursorOn = finePointer && !reduceMotion;
if (cursorOn) {
  html.classList.add('has-cursor');
  const cur = $('#cursor'), dot = $('.cursor-dot', cur), ring = $('.cursor-ring', cur), label = $('.cursor-label', cur);
  let x = -100, y = -100, rx = x, ry = y;
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    x = e.clientX; y = e.clientY;
    dot.style.transform = `translate3d(${x}px,${y}px,0)`;
    const tg = e.target;
    const inStage = tg.closest && tg.closest('#stage');
    const lab = !inStage && tg.closest && tg.closest('[data-cursor]');
    const link = !inStage && !lab && tg.closest && tg.closest('a,button,[role="button"]');
    cur.classList.toggle('is-brush', !!inStage);
    cur.classList.toggle('is-label', !!lab);
    cur.classList.toggle('is-link', !!link);
    if (lab) label.textContent = ui('cur_' + lab.dataset.cursor);
    cur.classList.remove('is-hidden');
  }, { passive: true });
  document.addEventListener('pointerleave', () => cur.classList.add('is-hidden'));
  (function follow() {
    rx += (x - rx) * .2; ry += (y - ry) * .2;
    ring.style.transform = `translate3d(${rx}px,${ry}px,0)`;
    requestAnimationFrame(follow);
  })();
}

/* ---------- Scroll: nav, parallax del escenario, tarjetas apiladas ---------- */
const nav = $('#nav'), win = $('#window-wrap');
const stackMQ = matchMedia('(min-width: 900px) and (min-height: 700px)');
let cards = [], ticking = false;
function onScroll() {
  ticking = false;
  const y = scrollY;
  nav.classList.toggle('is-scrolled', y > 8);
  if (!reduceMotion && y < innerHeight * 1.2) win.style.transform = `translate3d(0,${(y * .06).toFixed(1)}px,0)`;
  if (!stackMQ.matches || reduceMotion) { cards.forEach(c => c.style.setProperty('--cover', 0)); return; }
  const vh = innerHeight, navH = nav.offsetHeight;
  cards.forEach((c, i) => {
    const n = cards[i + 1]; if (!n) { c.style.setProperty('--cover', 0); return; }
    const top = n.getBoundingClientRect().top, end = navH + 28 + (i + 1) * 14;
    const k = Math.min(1, Math.max(0, (vh - top) / (vh - end)));
    c.style.setProperty('--cover', k.toFixed(3));
  });
}
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
addEventListener('resize', onScroll);

/* ---------- Teasers: se reproducen solo cuando se ven ---------- */
const videoIO = new IntersectionObserver(entries => entries.forEach(en => {
  const v = en.target; if (en.isIntersecting) v.play().catch(() => {}); else v.pause();
}), { threshold: .35 });
function setupVideos() { $$('.project video, .grave video').forEach(v => videoIO.observe(v)); }

/* ---------- Inclinación de los medios según el cursor ---------- */
function setupTilt() {
  if (!finePointer || reduceMotion) return;
  $$('.project-media').forEach(m => {
    m.addEventListener('pointermove', e => {
      const r = m.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
      m.style.setProperty('--ry', (px * 6).toFixed(2) + 'deg'); m.style.setProperty('--rx', (-py * 5).toFixed(2) + 'deg');
    });
    m.addEventListener('pointerleave', () => { m.style.setProperty('--rx', '0deg'); m.style.setProperty('--ry', '0deg'); });
  });
}

/* ---------- Sección activa en la navegación ---------- */
(() => {
  const links = $$('[data-sec]');
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) links.forEach(a => a.classList.toggle('is-active', a.dataset.sec === en.target.id));
  }), { rootMargin: '-45% 0px -50% 0px' });
  ['proyectos', 'cementerio', 'proceso', 'yo'].forEach(id => io.observe(document.getElementById(id)));
})();

/* ---------- Inicio ---------- */
renderAll(); renderBanner();
const h = location.hash.slice(1);
if (h && findItem(h)) setTimeout(() => openProject(h), 300);
})();
</script>
